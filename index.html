<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>枠抜き文字デモ</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        background: #1e1e26;
        font-family: sans-serif;
        color: #eee;
      }
      canvas {
        background: repeating-conic-gradient(#ff6b6b 0% 25%, #4ecdc4 0% 50%) 50% /
          40px 40px;
        border-radius: 8px;
        max-width: 100%;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: center;
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 12px;
        gap: 4px;
      }
      input[type="text"] {
        font-size: 16px;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <h1>枠抜き文字（縁取り文字）デモ</h1>
    <div class="controls">
      <label
        >テキスト
        <input id="text" type="text" value="HELLO" />
      </label>
      <label
        >フォントサイズ
        <input id="fontSize" type="range" min="20" max="200" value="120" />
      </label>
      <label
        >縁の太さ
        <input id="strokeWidth" type="range" min="0" max="20" value="4" />
      </label>
      <label
        >縁の色（外側）
        <input id="strokeColor" type="color" value="#fff" />
      </label>
      <label
        >縁の色（中間）
        <input id="strokeColor2" type="color" value="#f0a" />
      </label>
    </div>
    <canvas id="canvas" width="800" height="300"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const textInput = document.getElementById("text");
      const fontSizeInput = document.getElementById("fontSize");
      const strokeWidthInput = document.getElementById("strokeWidth");
      const strokeColorInput = document.getElementById("strokeColor");
      const strokeColor2Input = document.getElementById("strokeColor2");

      function draw() {
        const text = textInput.value || "";
        const fontSize = Number(fontSizeInput.value);
        const strokeWidth = Number(strokeWidthInput.value);
        const strokeColor = strokeColorInput.value;
        const strokeColor2 = strokeColor2Input.value;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = `bold ${fontSize}px "Noto Sans JP"`;
        ctx.letterSpacing = `${fontSize / 10}px`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const x = canvas.width / 2;
        const y = canvas.height / 2;

        // 影を描画（同じ影を重ね描きして濃くする）
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 6;
        ctx.shadowOffsetY = 6;

        ctx.strokeStyle = "#000";
        ctx.lineWidth = strokeWidth * 3;
        ctx.strokeText(text, x, y);

        // 影が二重にならないよう塗りつぶしの前に無効化
        ctx.shadowColor = "transparent";

        // 太さの異なる縁を外側から重ねて描き、三重縁取りにする
        if (strokeWidth > 0) {
          ctx.strokeStyle = "#000";
          ctx.lineWidth = (strokeWidth + 1) * 3;
          ctx.strokeText(text, x, y);

          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = strokeWidth * 3;
          ctx.strokeText(text, x, y);
        }

        // 文字の内側を描画
        ctx.fillStyle = strokeColor2;
        ctx.fillText(text, x, y);
      }

      [
        textInput,
        fontSizeInput,
        strokeWidthInput,
        strokeColorInput,
        strokeColor2Input,
      ].forEach((el) => el.addEventListener("input", draw));

      draw();
    </script>
  </body>
</html>
