# Deploys whatever a release tag points at. Tags are only ever created by
# publishing a draft from `draft-release.yml`, so what is live is always the
# content of some release.

name: deploy-pages

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and never cancel one midway: a half-applied deploy
# would leave Pages serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - name: guard the source ref
      run: |
        # push always gives a tag here; this is really about workflow_dispatch,
        # whose ref selector also offers branches.
        if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
          echo "::error::deploy a release tag, not '${GITHUB_REF_NAME}'"
          exit 1
        fi
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: 'package.json'
        cache: 'npm'
    - run: make build
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./dist
    - id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
