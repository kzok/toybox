# Opt-in PR review by Claude. Reviews are not run on every PR: attach the
# `claude-review` label to request one. While the label is attached, later
# pushes to the PR are reviewed again.

name: claude-code-review

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  # The action exchanges the workflow's OIDC token for a Claude GitHub App token.
  id-token: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'claude-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 1
    - uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          Review this pull request. The PR branch is already checked out in the
          working directory, and CLAUDE.md holds this repository's conventions.

          Focus on correctness: logic errors, unhandled edge cases, and subtle
          regressions. Skip anything CI already enforces (biome formatting and
          lint, TypeScript type errors).

          Post findings as inline comments on the offending lines. Use a
          top-level comment for general observations. If nothing is worth
          raising, say so briefly instead of padding the review.
        claude_args: |
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          --max-turns 20
