name: e2e

on:
  push:
    # branches only. a tag push would just redo what the tagged commit already
    # ran on its branch.
    branches:
    - '**'

permissions:
  contents: read

# supersede the runs of an outdated push on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: 'package.json'
        cache: 'npm'
    - name: prepare the app and the docker image in parallel
      shell: bash
      run: |
        # buffer the image build output instead of interleaving it with
        # `make build`, which would make the log unreadable.
        image_log="${RUNNER_TEMP}/e2e-image.log"
        ./e2e/runner.sh build >"${image_log}" 2>&1 &
        image_pid=$!

        app_status=0
        make build || app_status=$?

        image_status=0
        wait "${image_pid}" || image_status=$?

        echo "::group::docker image build"
        cat "${image_log}"
        echo "::endgroup::"

        if [ "${app_status}" -ne 0 ] || [ "${image_status}" -ne 0 ]; then
          echo "setup failed (make build=${app_status}, docker build=${image_status})" >&2
          exit 1
        fi
    - run: ./e2e/runner.sh run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ matrix.shard }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 7

  # the ruleset requires a check named `e2e`. the shard jobs above report
  # under their own names, so this job reports their result as `e2e`.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.e2e-shard.result }}" = success
