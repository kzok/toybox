# e2e is far slower than the checks in test.yml, hence limited to the main branch
# and the pull requests targeting it.

name: e2e

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: 'package.json'
        cache: 'npm'
    - name: prepare the app and the docker image in parallel
      shell: bash
      run: |
        # buffer the image build output instead of interleaving it with
        # `make build`, which would make the log unreadable.
        image_log="${RUNNER_TEMP}/e2e-image.log"
        ./e2e/runner.sh build >"${image_log}" 2>&1 &
        image_pid=$!

        app_status=0
        make build || app_status=$?

        image_status=0
        wait "${image_pid}" || image_status=$?

        echo "::group::docker image build"
        cat "${image_log}"
        echo "::endgroup::"

        if [ "${app_status}" -ne 0 ] || [ "${image_status}" -ne 0 ]; then
          echo "setup failed (make build=${app_status}, docker build=${image_status})" >&2
          exit 1
        fi
    - run: ./e2e/runner.sh run
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 7
