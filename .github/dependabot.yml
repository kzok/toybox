version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14
      semver-major-days: 30
    ignore:
      # Keep in sync with the Node.js version pinned by volta manually.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  # e2e/Dockerfile
  - package-ecosystem: "docker"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
